---
# Diseno esperado - Sucursal 01 (Actividad 1, Fase 2)
# Equipos: R-SUC-01, SW-SUC-01-CORE (.14), SW-SUC-01-ACC1 (.15),
# SW-SUC-01-ACC2 (.16), SW-SUC-01-ACC3 (.17). Switch1/Switch2 son
# capa 2 no gestionados (PC8 detras de Switch1 en VLAN 99) y no se auditan.
sucursal: sucursal_01
descripcion: Diseno esperado con VLAN USUARIOS_VLAN10/20 y GESTION

vlans_esperadas:
  - id: 10
    nombre: USUARIOS_VLAN10
    estado: active
  - id: 20
    nombre: USUARIOS_VLAN20
    estado: active
  - id: 99
    nombre: GESTION
    estado: active

trunk:
  native_vlan: 99
  allowed_vlans: [10, 20, 99]

switches:
  SW-SUC-01-CORE:
    mgmt_ip: 192.168.99.14/24
    puertos_acceso:
      - puerto: GigabitEthernet0/0
        vlan: 10
        descripcion: PC2 - VLAN10
      - puerto: GigabitEthernet0/1
        vlan: 10
        descripcion: PC3 - VLAN10
      - puerto: GigabitEthernet0/2
        vlan: 20
        descripcion: PC5 - VLAN20
      - puerto: GigabitEthernet0/3
        vlan: 20
        descripcion: PC4 - VLAN20
      - puerto: GigabitEthernet1/0
        vlan: 99
        descripcion: PC6 - VLAN99
    puertos_trunk:
      - puerto: GigabitEthernet1/1
        native_vlan: 99
        allowed_vlans: [10, 20, 99]
        descripcion: Hacia R-SUC-01 - Troncal Nativa99
      - puerto: GigabitEthernet1/2
        native_vlan: 99
        allowed_vlans: [10, 20, 99]
        descripcion: Hacia SW-SUC-01-ACC1 Gi0/0 - Troncal Nativa99

  SW-SUC-01-ACC1:
    mgmt_ip: 192.168.99.15/24
    puertos_acceso:
      - puerto: GigabitEthernet0/1
        vlan: 10
        descripcion: PC7 - VLAN10
      - puerto: GigabitEthernet0/2
        vlan: 99
        descripcion: Switch1 - VLAN99
      - puerto: GigabitEthernet0/3
        vlan: 20
        descripcion: PC8 - VLAN20
    puertos_trunk:
      - puerto: GigabitEthernet0/0
        native_vlan: 99
        allowed_vlans: [10, 20, 99]
        descripcion: Hacia SW-SUC-01-CORE Gi1/2 - Troncal Nativa99
      - puerto: GigabitEthernet1/0
        native_vlan: 99
        allowed_vlans: [10, 20, 99]
        descripcion: Hacia SW-SUC-01-ACC2 Gi1/1 - Troncal Nativa99

  SW-SUC-01-ACC2:
    mgmt_ip: 192.168.99.16/24
    puertos_acceso:
      - puerto: GigabitEthernet0/0
        vlan: 10
        descripcion: PC12 - VLAN10
      - puerto: GigabitEthernet0/1
        vlan: 10
        descripcion: PC14 - VLAN10
      - puerto: GigabitEthernet0/2
        vlan: 20
        descripcion: PC10 - VLAN20
      - puerto: GigabitEthernet0/3
        vlan: 20
        descripcion: PC11 - VLAN20
      - puerto: GigabitEthernet1/0
        vlan: 99
        descripcion: PC13 - VLAN99
    puertos_trunk:
      - puerto: GigabitEthernet1/1
        native_vlan: 99
        allowed_vlans: [10, 20, 99]
        descripcion: Hacia SW-SUC-01-ACC1 Gi1/0 - Troncal Nativa99
      - puerto: GigabitEthernet1/2
        native_vlan: 99
        allowed_vlans: [10, 20, 99]
        descripcion: Hacia SW-SUC-01-ACC3 Gi0/0 - Troncal Nativa99

  SW-SUC-01-ACC3:
    mgmt_ip: 192.168.99.17/24
    puertos_acceso:
      - puerto: GigabitEthernet0/1
        vlan: 10
        descripcion: PC16 - VLAN10
      - puerto: GigabitEthernet0/2
        vlan: 99
        descripcion: Switch2 - VLAN99
      - puerto: GigabitEthernet0/3
        vlan: 20
        descripcion: PC17 - VLAN20
    puertos_trunk:
      - puerto: GigabitEthernet0/0
        native_vlan: 99
        allowed_vlans: [10, 20, 99]
        descripcion: Hacia SW-SUC-01-ACC2 Gi1/2 - Troncal Nativa99

routers:
  R-SUC-01:
    interfaz_fisica: GigabitEthernet0/1
    hacia: SW-SUC-01-CORE
    subinterfaces:
      - id: 10
        interfaz: GigabitEthernet0/1.10
        encapsulation: 10
        native: false
        ip: 192.168.10.1/24
      - id: 20
        interfaz: GigabitEthernet0/1.20
        encapsulation: 20
        native: false
        ip: 192.168.20.1/24
      - id: 99
        interfaz: GigabitEthernet0/1.99
        encapsulation: 99
        native: true
        ip: 192.168.99.1/24
