---
- name: Configurar R-SUC-01 router-on-a-stick + DHCP
  hosts: routers
  gather_facts: false
  connection: ansible.netcommon.network_cli
  tasks:
    - name: Subinterfaz VLAN 10
      cisco.ios.ios_config:
        lines:
          - encapsulation dot1Q 10
          - ip address 192.168.10.1 255.255.255.0
          - no shutdown
        parents: interface GigabitEthernet0/1.10

    - name: Subinterfaz VLAN 20
      cisco.ios.ios_config:
        lines:
          - encapsulation dot1Q 20
          - ip address 192.168.20.1 255.255.255.0
          - no shutdown
        parents: interface GigabitEthernet0/1.20

    - name: Subinterfaz VLAN 99 nativa
      cisco.ios.ios_config:
        lines:
          - encapsulation dot1Q 99 native
          - ip address 192.168.99.1 255.255.255.0
          - no shutdown
        parents: interface GigabitEthernet0/1.99

    - name: Fisica Gi0/1 arriba
      cisco.ios.ios_config:
        lines:
          - no shutdown
        parents: interface GigabitEthernet0/1

    - name: Excluir IPs estaticas
      cisco.ios.ios_config:
        lines:
          - "ip dhcp excluded-address {{ item }}"
      loop: "{{ dhcp_excluidos }}"

    - name: Pools DHCP
      cisco.ios.ios_config:
        lines:
          - "network {{ item.network }}"
          - "default-router {{ item.router }}"
          - "dns-server {{ item.dns }}"
          - lease 7
        parents: "ip dhcp pool {{ item.name }}"
      loop: "{{ dhcp_pools }}"

    - name: Guardar
      cisco.ios.ios_config:
        save_when: modified

    - name: Ver bindings DHCP
      cisco.ios.ios_command:
        commands:
          - show ip dhcp binding
      register: dhcp_bind

    - name: Mostrar bindings
      ansible.builtin.debug:
        var: dhcp_bind.stdout_lines
