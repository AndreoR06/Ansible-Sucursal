---
- name: Configurar interfaces en los switches
  hosts: switches
  gather_facts: false
  connection: ansible.netcommon.network_cli
  tasks:
    - name: Configurar puertos de acceso para PCs
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item.name }}"
            mode: access
            access:
              vlan: "{{ item.vlan }}"
        state: merged
      loop: "{{ puertos_acceso | default([]) }}"
      when: puertos_acceso is defined
    - name: Configurar puertos trunk entre switches y hacia router
      cisco.ios.ios_config:
        parents: "interface {{ item.name }}"
        lines:
          - switchport trunk encapsulation dot1q
          - switchport trunk native vlan {{ item.native_vlan | default(99) }}
          - switchport trunk allowed vlan {{ trunk_allowed_vlans | default('10,20,99') }}
          - switchport mode trunk
          - no shutdown
      loop: "{{ puertos_trunk | default([]) }}"
      when: puertos_trunk is defined
    - name: Guardar configuracion
      cisco.ios.ios_config:
        save_when: modified
