---
- name: Evidencia de switches (fase {{ fase }})
  hosts: switches
  gather_facts: false
  connection: ansible.netcommon.network_cli
  vars:
    fase: manual
  tasks:
    - name: Crear carpeta de evidencia
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../evidencias/{{ fase }}"
        state: directory
      delegate_to: localhost
      run_once: true
    - name: Recolectar estado
      cisco.ios.ios_command:
        commands:
          - show running-config
          - show vlan brief
          - show interfaces trunk
          - show ip interface brief
          - show version
      register: estado
    - name: Guardar running-config
      ansible.builtin.copy:
        content: "{{ estado.stdout[0] }}"
        dest: "{{ playbook_dir }}/../evidencias/{{ fase }}/{{ inventory_hostname }}-running-config.txt"
      delegate_to: localhost
    - name: Guardar show vlan brief
      ansible.builtin.copy:
        content: "{{ estado.stdout[1] }}"
        dest: "{{ playbook_dir }}/../evidencias/{{ fase }}/{{ inventory_hostname }}-show-vlan-brief.txt"
      delegate_to: localhost
    - name: Guardar show interfaces trunk
      ansible.builtin.copy:
        content: "{{ estado.stdout[2] }}"
        dest: "{{ playbook_dir }}/../evidencias/{{ fase }}/{{ inventory_hostname }}-show-interfaces-trunk.txt"
      delegate_to: localhost
    - name: Guardar show ip interface brief
      ansible.builtin.copy:
        content: "{{ estado.stdout[3] }}"
        dest: "{{ playbook_dir }}/../evidencias/{{ fase }}/{{ inventory_hostname }}-show-ip-interface-brief.txt"
      delegate_to: localhost
    - name: Guardar show version
      ansible.builtin.copy:
        content: "{{ estado.stdout[4] }}"
        dest: "{{ playbook_dir }}/../evidencias/{{ fase }}/{{ inventory_hostname }}-show-version.txt"
      delegate_to: localhost

- name: Evidencia de router (fase {{ fase }})
  hosts: routers
  gather_facts: false
  connection: ansible.netcommon.network_cli
  vars:
    fase: manual
  tasks:
    - name: Recolectar estado del router
      cisco.ios.ios_command:
        commands:
          - show running-config
          - show ip interface brief
          - show ip route
          - show version
      register: estado_r
    - name: Guardar running-config
      ansible.builtin.copy:
        content: "{{ estado_r.stdout[0] }}"
        dest: "{{ playbook_dir }}/../evidencias/{{ fase }}/{{ inventory_hostname }}-running-config.txt"
      delegate_to: localhost
    - name: Guardar show ip interface brief
      ansible.builtin.copy:
        content: "{{ estado_r.stdout[1] }}"
        dest: "{{ playbook_dir }}/../evidencias/{{ fase }}/{{ inventory_hostname }}-show-ip-interface-brief.txt"
      delegate_to: localhost
    - name: Guardar show ip route
      ansible.builtin.copy:
        content: "{{ estado_r.stdout[2] }}"
        dest: "{{ playbook_dir }}/../evidencias/{{ fase }}/{{ inventory_hostname }}-show-ip-route.txt"
      delegate_to: localhost
    - name: Guardar show version
      ansible.builtin.copy:
        content: "{{ estado_r.stdout[3] }}"
        dest: "{{ playbook_dir }}/../evidencias/{{ fase }}/{{ inventory_hostname }}-show-version.txt"
      delegate_to: localhost